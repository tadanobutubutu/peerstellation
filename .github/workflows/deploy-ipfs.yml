name: Verify and deploy Peerstellation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Type, unit, browser, and build gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Enable the Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Install dependencies
        run: npm ci

      - name: Verify types, units, WASM, and production build
        run: npm run check

      - name: Verify Biome formatting and lint
        run: npm run quality

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify real-browser behavior and accessibility
        run: npm run test:e2e

      - name: Verify Pa11y and HTML validity
        run: npm run test:a11y

  deploy:
    name: Publish primary and immutable releases
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: peerstellation-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://ipfsuniverse.xyz/

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Enable the Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked

      - name: Install dependencies
        run: npm ci

      - name: Build immutable assets
        run: npm run build

      - name: Identify the production Worker before deploying
        id: worker_target
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          const deploy = config.name === 'ipfs-universe-gateway'
            && config.main === './worker/src/index.ts'
            && config.assets?.directory === './dist'
            && config.routes?.some((route) => route.pattern === '*ipfsuniverse.xyz/*');
          appendFileSync(process.env.GITHUB_OUTPUT, `deploy=${deploy}\n`);
          if (!deploy) console.log('Worker deployment skipped because this branch does not target the production gateway.');
          NODE

      - name: Deploy the primary Cloudflare release
        if: steps.worker_target.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:cloudflare

      - name: Pin the same release to public IPFS
        id: pinata
        env:
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: npm run deploy:pinata

      - name: Point DNSLink at the immutable release
        env:
          CID: ${{ steps.pinata.outputs.cid }}
          CLOUDFLARE_DNS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: npm run deploy:dnslink

      - name: Remove superseded Peerstellation pins
        env:
          CURRENT_CID: ${{ steps.pinata.outputs.cid }}
          PINATA_JWT: ${{ secrets.PINATA_JWT }}
        run: npm run deploy:pinata:prune
