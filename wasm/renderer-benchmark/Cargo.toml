[package]
name = "peerstellation-renderer-benchmark"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
js-sys = "0.3.77"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.50"
wgpu = { version = "27.0.1", default-features = false, features = ["webgpu", "webgl", "wgsl"] }
web-sys = { version = "0.3.77", features = ["HtmlCanvasElement"] }
